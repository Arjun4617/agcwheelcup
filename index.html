<title>AGC Car Accessories — Wheel Cover Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#CC202E;--red-dark:#a81a26;--bg:#fff;--soft:#f6f4f4;--lbl:#1d1d1f;--lbl3:#6b6b70;--border:#e6e2e2}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--lbl);font:15px/1.4 Figtree,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1280px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
header{position:sticky;top:0;z-index:10;background:var(--red);border-bottom:1px solid rgba(255,255,255,.22);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{height:38px;width:auto;display:block}
.pill{background:var(--red);color:#fff;border:none;border-radius:999px;padding:11px 22px;font:600 14px Figtree,sans-serif;cursor:pointer}
.bar .pill{background:#fff;color:var(--red)}
.pill:active{background:var(--red-dark)}
.hero{background:var(--red);color:#fff;position:relative;overflow:hidden}
.hero .wrap{position:relative;padding-top:56px;padding-bottom:44px}
.hero h1{font-size:clamp(40px,8vw,84px);line-height:1.02;font-weight:600;letter-spacing:-1.5px}
.hero h1 span{display:block}
.hero p{margin-top:16px;font-size:clamp(15px,2.2vw,19px);font-weight:300;max-width:520px}
.contact{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.wa{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--red);text-decoration:none;border-radius:999px;padding:10px 18px;font:600 14px Figtree,sans-serif}
.wa svg{width:18px;height:18px;fill:#25D366}
footer .wa{background:var(--soft);color:var(--lbl);margin:4px}
footer .contact{justify-content:center;margin:0 0 16px}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:18px 0 6px}
input{flex:1;min-width:0;max-width:420px;background:var(--soft);border:1px solid var(--border);color:var(--lbl);border-radius:999px;padding:12px 18px;font:400 16px Figtree,sans-serif;outline:none}
input:focus{border-color:var(--red);background:#fff}
#status{color:var(--lbl3);font-size:13px;margin-left:auto}
#err{display:none;color:var(--red);padding:12px 0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:8px 0 40px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden}
.pic{position:relative;background:var(--soft)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in}
.dl{position:absolute;bottom:10px;right:10px;width:34px;height:34px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:none;color:#1d1d1f;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.dl:hover{background:#fff}
.dl:disabled{opacity:.5;cursor:wait}
.body{padding:12px 14px 14px}
.glabel{margin-top:8px;font-size:13px;font-weight:600;color:var(--red)}
.glabel:first-child{margin-top:0}
dl{display:grid;grid-template-columns:auto auto;justify-content:start;gap:2px 6px;font-size:14px}
dt{color:var(--lbl3)}dt::after{content:' :'}dd{font-weight:600}
.none{font-size:13px;color:var(--lbl3)}
footer{border-top:1px solid var(--border);padding:22px 0 30px;text-align:center;color:var(--lbl3);font-size:13px}
#view{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;align-items:center;justify-content:center;padding:20px}
#view.open{display:flex}#view img{max-width:100%;max-height:100%;border-radius:10px}
@media(max-width:600px){
  .bar{height:56px}.logo{height:32px}.pill{padding:9px 16px}
  .hero .wrap{padding-top:36px;padding-bottom:30px}
  input{max-width:none}#status{margin-left:0;width:100%}
  #grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .body{padding:10px}dl{font-size:13px}
}
</style>
</head>
